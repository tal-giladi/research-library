<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Research library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="A personal research library kept as markdown files.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #7a4b2a; }
    .sidebar { padding-top: 20px; }
    .sidebar > h1 { margin: 0 20px 10px; font-size: 1.1em; }
    .markdown-section { max-width: 900px; }
    /* Status words carry most of the signal in the generated lists. */
    .markdown-section li code { font-size: .82em; padding: 1px 5px; }
    .markdown-section input[type=checkbox] { margin-right: .4em; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Research library',
      repo: 'https://github.com/tal-giladi/research-library',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      maxLevel: 4,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        placeholder: 'Search the library...',
        noData: 'No results.',
        depth: 4,
        paths: 'auto'
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      plugins: [
        // Docsify renders YAML frontmatter as body text. Strip it and put the
        // few fields worth seeing back as a one-line header instead.
        function (hook) {
          hook.beforeEach(function (content) {
            var m = content.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
            if (!m) return content;
            var fm = m[1];
            function get(key) {
              var r = new RegExp('^' + key + ':\\s*(.*)$', 'm').exec(fm);
              return r ? r[1].trim().replace(/^["']|["']$/g, '') : '';
            }
            function list(key) {
              var v = get(key).replace(/^\[|\]$/g, '');
              return v ? v.split(',').map(function (s) {
                return s.trim().replace(/^["']|["']$/g, '');
              }) : [];
            }
            var bits = [];
            if (get('status')) bits.push('**' + get('status') + '**');
            var rating = parseInt(get('rating'), 10);
            if (rating > 0) bits.push('★'.repeat(rating));
            var topics = list('topics');
            if (topics.length) bits.push('`' + topics.join('` `') + '`');
            if (get('published')) bits.push(get('published'));
            if (get('url')) bits.push('[source](' + get('url') + ')');
            if (get('pdf')) bits.push('[pdf](' + get('pdf') + ')');
            var header = bits.length ? '> ' + bits.join(' &middot; ') + '\n' : '';
            var authors = list('authors');
            if (header && authors.length) {
              header += '>\n> ' + authors.slice(0, 8).join(', ')
                      + (authors.length > 8 ? ' et al.' : '') + '\n';
            }
            return (header ? header + '\n' : '') + content.slice(m[0].length);
          });
        }
      ]
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
</body>
</html>
