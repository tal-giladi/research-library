<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Research library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="A personal research library kept as markdown files.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #7a4b2a; }
    .sidebar { padding-top: 20px; }
    .sidebar > h1 { margin: 0 20px 10px; font-size: 1.1em; }
    .markdown-section { max-width: 900px; }
    /* Status words carry most of the signal in the generated lists. */
    .markdown-section li code { font-size: .82em; padding: 1px 5px; }
    .markdown-section input[type=checkbox] { margin-right: .4em; }
    .file-warning { max-width: 620px; margin: 12vh auto; padding: 0 24px;
      font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #2c3e50; }
    .file-warning h1 { font-size: 20px; margin: 0 0 12px; }
    .file-warning code { background: #f3f1ee; border-radius: 4px; padding: 2px 6px; }
    .file-warning pre { background: #f3f1ee; border-radius: 6px; padding: 12px 14px;
      overflow-x: auto; }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- Generated by `py lib.py build`: every page search should index. Must load
       before the config below reads it. -->
  <script src="search-paths.js"></script>
  <script>
    window.$docsify = {
      name: 'Research library',
      repo: 'https://github.com/tal-giladi/research-library',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      maxLevel: 4,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        placeholder: 'Search the library...',
        noData: 'No results.',
        depth: 4,
        // 'auto' would only cover what the sidebar links to.
        paths: window.LIBRARY_PATHS || 'auto',
        maxAge: 604800000  // a week; the index is cached in localStorage
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      plugins: [
        // Docsify renders YAML frontmatter as body text. Strip it and put the
        // few fields worth seeing back as a one-line header instead.
        function (hook) {
          hook.beforeEach(function (content) {
            var m = content.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
            if (!m) return content;
            var fm = m[1];
            function get(key) {
              var r = new RegExp('^' + key + ':\\s*(.*)$', 'm').exec(fm);
              return r ? r[1].trim().replace(/^["']|["']$/g, '') : '';
            }
            function list(key) {
              var v = get(key).replace(/^\[|\]$/g, '');
              return v ? v.split(',').map(function (s) {
                return s.trim().replace(/^["']|["']$/g, '');
              }) : [];
            }
            var bits = [];
            if (get('status')) bits.push('**' + get('status') + '**');
            var rating = parseInt(get('rating'), 10);
            if (rating > 0) bits.push('★'.repeat(rating));
            var topics = list('topics');
            if (topics.length) bits.push('`' + topics.join('` `') + '`');
            if (get('published')) bits.push(get('published'));
            if (get('url')) bits.push('[source](' + get('url') + ')');
            if (get('pdf')) bits.push('[pdf](' + get('pdf') + ')');
            var header = bits.length ? '> ' + bits.join(' &middot; ') + '\n' : '';
            var authors = list('authors');
            if (header && authors.length) {
              header += '>\n> ' + authors.slice(0, 8).join(', ')
                      + (authors.length > 8 ? ' et al.' : '') + '\n';
            }
            return (header ? header + '\n' : '') + content.slice(m[0].length);
          });
        }
      ]
    }
  </script>
  <script>
    // Opened by double-click, docsify cannot fetch the markdown (the browser
    // blocks file:// XHR) and renders a bare "404", which looks like the site
    // is broken rather than like the wrong way to open it. Say so instead, and
    // do not load docsify at all.
    if (location.protocol === 'file:') {
      // Drop docsify's theme too: it lays out around a .sidebar/.content pair
      // that never gets created here, which pushes the message off-centre.
      var theme = document.querySelector('link[href*="docsify"]');
      if (theme) { theme.parentNode.removeChild(theme); }
      document.body.innerHTML =
        '<div class="file-warning">' +
        '<h1>This page needs a web server</h1>' +
        '<p>Docsify fetches the markdown files over HTTP, and browsers block ' +
        'that for pages opened from disk. Opening <code>index.html</code> ' +
        'directly will only ever show a 404.</p>' +
        '<p>From the repo:</p>' +
        '<pre>py lib.py serve</pre>' +
        '<p>which builds, serves on <code>http://127.0.0.1:8899/</code> and ' +
        'opens it. For a viewer that <em>does</em> work offline from disk, use ' +
        '<code>py lib.py view</code> - that one is self-contained on purpose.</p>' +
        '<p>The published copy is at <a href="https://tal-giladi.github.io/research-library/">' +
        'tal-giladi.github.io/research-library</a>.</p>' +
        '</div>';
    } else {
      // async=false keeps the load order, which docsify's plugins depend on.
      [
        'https://cdn.jsdelivr.net/npm/docsify@4',
        'https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js',
        'https://cdn.jsdelivr.net/npm/docsify-copy-code@2',
        'https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js',
        'https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js',
        'https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js'
      ].forEach(function (src) {
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        document.head.appendChild(s);
      });
    }
  </script>
</body>
</html>
